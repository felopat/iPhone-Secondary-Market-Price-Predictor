name: Auto-Update Model

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs automatically every Sunday at midnight UTC
  workflow_dispatch:      # Adds a manual "Run workflow" button in GitHub

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Install required packages
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn numpy beautifulsoup4 requests

      # 4. Run scraper to get latest iPhone data
      - name: Run Scraper
        run: python scraper.py

      # 5. Retrain Random Forest model
      - name: Retrain Model
        run: python train.py

      # 6. Commit and push updated files back to GitHub
      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add iphone_price_prediction_500_rows.pkl model.pkl
          git commit -m "Auto-update model with latest scraped data" || exit 0
          git push